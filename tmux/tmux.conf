# =============================================================================
# tmux.conf — minimal, niri-directional, wallust-themed
# Cheatsheet: ~/.config/tmux/tmux-cheatsheet.md  (canonical — update alongside any binding change)
# =============================================================================

# --- Environment -----------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Source wallust colors -------------------------------------------------
# -q so a fresh checkout (before wallust runs) doesn't error on every start
source-file -q ~/.config/tmux/colors.conf

# --- Base options ----------------------------------------------------------
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g display-time 4000          # 4s — long enough to read messages
set -g display-panes-time 3000    # 3s — display-panes (q) idle timeout
set -g mode-keys vi
setw -g monitor-activity on
setw -g visual-activity off

# Clipboard: tmux itself can set the system clipboard via OSC52 (so tmux-yank works),
# but programs running inside panes cannot. Blocks SSH-host / hostile-output → clipboard hijack.
set -g set-clipboard external
# allow-passthrough disabled (tmux 3.3+ default).
# Enable per-pane on demand: tmux set -p allow-passthrough on

# Prefix C-b is the tmux default; no rebind needed.

# --- Pane focus (Alt+hjkl — no prefix) -------------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- Pane resize (Alt+Shift+hjkl — no prefix) ------------------------------
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- Pane splits -----------------------------------------------------------
# \ and | both split vertical — \ is the unshifted convenience alias
bind \\ split-window -hc "#{pane_current_path}"
bind |  split-window -hc "#{pane_current_path}"
bind -  split-window -vc "#{pane_current_path}"

# --- Pane operations -------------------------------------------------------
bind z resize-pane -Z
bind x kill-pane
bind q display-panes
bind o select-pane -t :.+

# --- Window operations -----------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind w choose-tree -w
bind , command-prompt -I "#W" { rename-window '%%' }
bind . command-prompt "move-window -t '%%'"
bind & kill-window
bind R move-window -r

# --- Session operations ----------------------------------------------------
bind s choose-session
bind d detach-client
bind D detach-client -a
bind $ command-prompt -I "#S" { rename-session '%%' }

# --- Reload config ---------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# --- Copy mode -------------------------------------------------------------
bind Enter copy-mode
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-line-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# --- Minimal status bar ----------------------------------------------------
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 40

# Left: session name only
set -g status-left " #S "

# Right: time only
set -g status-right " %H:%M "

# Window list: subtle color for active
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #[fg=#{@theme_bg},bg=#{@theme_blue}] #I:#W "

# Activity indicator
setw -g window-status-activity-style "fg=#{@theme_red}"

# --- Pane borders ----------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-style "fg=#{@theme_bright_black}"
set -g pane-active-border-style "fg=#{@theme_blue}"

# --- Messages --------------------------------------------------------------
set -g message-style         "fg=#{@theme_bg},bg=#{@theme_blue}"
set -g message-command-style "fg=#{@theme_bg},bg=#{@theme_blue}"

# Note: display-panes-colour and display-panes-active-colour take raw colour
# values (no #{...} format expansion). They live in colors.conf with the
# wallust-resolved literals — see wallust/templates/tmux-colors.conf.

# --- Status colors ---------------------------------------------------------
set -g status-style "fg=#{@theme_fg},bg=#{@theme_bg}"

# --- TPM plugins -----------------------------------------------------------
# Pinned to verified tags. Review before bumping:
#   cd ~/.config/tmux/plugins/<plugin> && git fetch && git log HEAD..origin/master --stat
set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-yank#v2.3.0'

# resurrect/continuum: manual restore only (no auto on tmux start), no scrollback persistence.
#   Save:    prefix C-s
#   Restore: prefix C-r
set -g @continuum-save-interval '15'
# @continuum-restore disabled — auto-restore is a persistence primitive (any local-write attacker
# planting ~/.local/share/tmux/resurrect/last would influence next tmux start).
# @resurrect-capture-pane-contents disabled — saves layout/CWD/cmd only, never scrollback
# (scrollback frequently contains secrets: env, kubectl, gh auth token, .env, tracebacks).

# tmux-yank: send selections to system clipboard (Ctrl+V paste in browsers/apps).
# Option name uses underscore per the plugin's helpers.sh; the legacy `@yank-selection`
# (dash) was a no-op and the plugin used its defaults. Mouse copy is handled
# inside copy-mode by tmux itself (see MouseDragEnd1Pane binding above) — it
# uses tmux's native OSC52 path, which set-clipboard=external still permits.
set -g @yank_selection 'clipboard'

run '~/.config/tmux/plugins/tpm/tpm'
