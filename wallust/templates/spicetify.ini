[Spotify]
; Surface / Backgrounds
text                       = {{foreground | strip}}
subtext                    = {{foreground | strip}}
main                       = {{background | strip}}
sidebar                    = {{color0 | strip}}
player                     = {{color0 | strip}}
card                       = {{color0 | strip}}

; Buttons & Accents (Mapped to 'tertiary' which is usually color4 or color5)
button                     = {{color4 | strip}}
button-active              = {{color4 | strip}}
button-disabled            = {{color8 | strip}}

; Notifications
notification               = {{color4 | strip}}
notification-error         = {{color1 | strip}}

; Hardcoded matches converted to dynamic colors
shadow                     = 000000
tab-active                 = {{color8 | strip}}
playback-bar               = {{foreground | strip}}
misc                       = {{color8 | strip}}
selected-row               = {{foreground | strip}}

; Custom Theme Keys (Mapped to behave like the hex codes you provided)
custom-main-secondary      = {{background | lighten(10) | strip}}
custom-main-soft-secondary = {{background | lighten(5) | strip}}
custom-highlight           = {{color8 | strip}}
custom-link-hover          = {{foreground | strip}}
custom-selected-button     = {{color8 | darken(10) | strip}}
custom-subdued             = {{color7 | strip}}
custom-success             = {{color4 | strip}}
