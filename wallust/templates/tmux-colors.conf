# tmux colors.conf - Generated by wallust, do not edit
# This file is colors-only (data). All style policy lives in tmux.conf and
# references these via #{@theme_*} format strings.

set -g @theme_bg             "{{background}}"
set -g @theme_fg             "{{foreground}}"
set -g @theme_cursor         "{{cursor}}"
set -g @theme_black          "{{color0}}"
set -g @theme_red            "{{color1}}"
set -g @theme_green          "{{color2}}"
set -g @theme_yellow         "{{color3}}"
set -g @theme_blue           "{{color4}}"
set -g @theme_magenta        "{{color5}}"
set -g @theme_cyan           "{{color6}}"
set -g @theme_white          "{{color7}}"
set -g @theme_bright_black   "{{color8}}"
set -g @theme_bright_red     "{{color9}}"
set -g @theme_bright_green   "{{color10}}"
set -g @theme_bright_yellow  "{{color11}}"
set -g @theme_bright_blue    "{{color12}}"
set -g @theme_bright_magenta "{{color13}}"
set -g @theme_bright_cyan    "{{color14}}"
set -g @theme_bright_white   "{{color15}}"

# Raw colour options (do not accept #{...} format expansion in tmux, so they
# need literal values here rather than living in tmux.conf with @theme_* refs).
set -g display-panes-colour        "{{color4}}"
set -g display-panes-active-colour "{{color1}}"
