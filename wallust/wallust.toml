# wallust v3.5
# https://explosion-mental.codeberg.page/wallust/

backend = "fastresize"
color_space = "lab"
palette = "harddark"
check_contrast = true
new_engine = true

# Alpha value for templating (0-100). Uncomment to use {{alpha | alpha_hexa}} in templates.
#alpha = 100

[templates]
# NOTE: prefer '' over "" for paths, avoids escaping.
# src:  relative path under ~/.config/wallust/templates/
# dst:  absolute path for the generated file.
# If either is a directory, both should be directories.

alacritty     = { src = 'alacritty.toml',     dst = '~/.config/alacritty/colors.toml' }
# ghostty       = { src = 'ghostty.conf',       dst = '~/.config/ghostty/themes/colors.conf' }
gtk3          = { src = 'gtk.css',            dst = '~/.config/gtk-3.0/colors.css' }
gtk4          = { src = 'gtk.css',            dst = '~/.config/gtk-4.0/colors.css' }
kitty         = { src = 'kitty.conf',         dst = '~/.config/kitty/colors.conf' }
mako          = { src = 'mako',               dst = '~/.config/mako/config' }
neopywal      = { src = 'neopywal.vim',       dst = '~/.cache/wallust/colors_neopywal.vim' }
opencode      = { src = 'opencode-theme.json',dst = '~/.config/opencode/themes/wallust.json' }
rofi          = { src = 'rofi.rasi',          dst = '~/.config/rofi/colors/wallust.rasi' }
sevens-shell  = { src = 'sevens-shell-theme.json', dst = '~/.config/sevens-shell/theme.json' }
telegram      = { src = 'telegram',           dst = '~/.local/share/TelegramDesktop/tdata/wallust.tdesktop-theme' }
vicinae       = { src = 'vicinae.toml',       dst = '~/.local/share/vicinae/themes/wallust.toml' }
vscode        = { src = 'vscode.json',        dst = '~/.cache/wallust/colors.json' }
vscode2       = { src = 'vscode',             dst = '~/.cache/wallust/colors' }
waybar        = { src = 'waybar.css',         dst = '~/.config/waybar/colors.css' }
tmux          = { src = 'tmux-colors.conf',    dst = '~/.config/tmux/colors.conf' }
zathurarc     = { src = 'zathurarc',          dst = '~/.config/zathura/zathurarc' }
zed           = { src = 'zed.json',           dst = '~/.config/zed/themes/wallust.json' }
obsidian      = { src = 'obsidian.css',        dst = '~/Documents/Obsidian Vault/.obsidian/snippets/wallust.css' }

# zellij theme is generated by scripts/theme-sync.sh (requires RGB integers, not hex)
